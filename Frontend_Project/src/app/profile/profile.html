<section class="profile-page">
  @if (authService.currentUser(); as user) {
    <div class="profile-card card">
      @if (!isEditing()) {
        <img [src]="authService.getPhotoUrl(user.photo)" alt="" class="profile-avatar" />
        <h1>{{ user.name }}</h1>
        @if (user.role) {
          <span class="badge badge-flame">{{ user.role }}</span>
        }

        <div class="profile-details">
          <div class="detail-row">
            <span class="detail-label">Email</span>
            <span>{{ user.email }}</span>
          </div>
          @if (user.phone) {
            <div class="detail-row">
              <span class="detail-label">Phone</span>
              <span>{{ user.phone }}</span>
            </div>
          }
        </div>

        <div class="profile-actions">
          <button class="btn btn-ghost" (click)="startEdit()">Edit Profile</button>
          <a routerLink="/dashboard" class="btn btn-ghost">View orders</a>
          <button class="btn btn-primary" (click)="onLogout()">Log out</button>
        </div>
      } @else {
        <h1>Edit Profile</h1>

        @if (errorMessage()) {
          <div class="form-error">{{ errorMessage() }}</div>
        }

        <form (ngSubmit)="saveProfile()">
          <div class="photo-field">
            <label class="photo-upload" for="edit-photo">
              @if (photoPreview()) {
                <img [src]="photoPreview()" alt="" />
              } @else {
                <img [src]="authService.getPhotoUrl(user.photo)" alt="" />
              }
            </label>
            <input id="edit-photo" type="file" accept="image/*" (change)="onFileSelected($event)" hidden />
          </div>

          <div class="field">
            <label for="edit-name">Full name</label>
            <input id="edit-name" type="text" [(ngModel)]="name" name="name" required />
          </div>

          <div class="field">
            <label for="edit-phone">Phone</label>
            <input id="edit-phone" type="tel" [(ngModel)]="phone" name="phone" />
          </div>

          <div class="profile-actions">
            <button type="button" class="btn btn-ghost" (click)="cancelEdit()">Cancel</button>
            <button type="submit" class="btn btn-primary" [disabled]="saving()">
              {{ saving() ? 'Saving…' : 'Save changes' }}
            </button>
          </div>
        </form>
      }
    </div>
  }
</section>

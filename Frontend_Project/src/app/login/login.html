<section class="auth-page">
  <div class="auth-card card">
    <h1>Welcome back.</h1>
    <p class="auth-sub">Log in to reorder your favorites.</p>

    @if (errorMessage) {
      <div class="form-error">{{ errorMessage }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="********" required />
      </div>

      <button type="submit" class="btn btn-neon-green btn-block">Log in</button>
    </form>

    <p class="auth-switch">Don't have account? <a routerLink="/signup">Create an account</a></p>
  </div>
</section>

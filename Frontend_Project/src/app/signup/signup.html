<section class="auth-page">
  <div class="auth-card card">
    <h1>Create your account.</h1>
    <p class="auth-sub">Join to place orders.</p>

    @if (errorMessage) {
      <div class="form-error">{{ errorMessage }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="photo-field">
        <label class="photo-upload" for="photo">
          @if (photoPreview()) {
            <img [src]="photoPreview()" alt="" />
          } @else {
            <span>Add photo</span>
          }
        </label>
        <input id="photo" type="file" accept="image/*" (change)="onFileSelected($event)" hidden />
      </div>

      <div class="field">
        <label for="name">Full name</label>
        <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Jane Doe" required />
      </div>

      <div class="field">
        <label for="signup-email">Email</label>
        <input id="signup-email" type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" type="tel" [(ngModel)]="phone" name="phone" placeholder="(555) 000-0000" />
      </div>

      <div class="field">
        <label for="signup-password">Password</label>
        <input id="signup-password" type="password" [(ngModel)]="password" name="password" placeholder="At least 8 characters" required />
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign up</button>
    </form>

    <p class="auth-switch">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</section>
